<section class="section" aria-labelledby="cta-title">
      <div class="container">
        <div class="cta reveal">
          <div class="cta__grid">
            <div>
              <h2 id="cta-title">Сделайте первый шаг — запишитесь на консультацию</h2>
              <p>Напишите пару слов о том, что беспокоит, — я отвечу, предложу удобное время и формат: онлайн или очно в Екатеринбурге.</p>
              <div class="cta__contacts">
                <a href="tel:{{phone}}">{{phone_display}}</a>
                <a href="https://t.me/{{telegram}}" target="_blank" rel="noopener">Telegram @{{telegram}}</a>
              </div>
            </div>
            <div class="cta__actions">
              <a class="btn btn--light" href="{{root}}contacts.html#booking">Записаться на консультацию</a>
              <a class="btn btn--outline-light" href="https://t.me/{{telegram}}" target="_blank" rel="noopener">{{icon send}}Написать в Telegram</a>
            </div>
          </div>
        </div>
      </div>
    </section>
